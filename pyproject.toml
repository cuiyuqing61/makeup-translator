[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "makeup-translator"
version = "0.1.0"
description = "Turn a makeup reference image into a personalized, executable makeup tutorial."
requires-python = ">=3.11"
dependencies = [
  "qwen-agent==0.0.31",
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "python-dateutil==2.9.0.post0",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.75,<3",
  "pydantic>=2.10,<3",
  "Pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
images = ["mediapipe>=0.10.35,<1.1"]

[project.scripts]
makeup-translator = "makeup_translator.cli:main"
makeup-products = "makeup_translator.product_cli:main"
makeup-web = "makeup_translator.web_cli:main"

[tool.setuptools.packages.find]
include = ["makeup_translator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
